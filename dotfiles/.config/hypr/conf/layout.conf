dwindle {
    pseudotile = true
    preserve_split = true
}

gesture = 3, horizontal, workspace

binds {
  workspace_back_and_forth = false
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

device {
    name = mouse-passthrough-(absolute)
    output = DP-3
}