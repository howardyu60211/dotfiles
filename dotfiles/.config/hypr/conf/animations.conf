animations {
    enabled = true

    # 1. 定義貝茲曲線 (Bezier Curve)
    # 這是一個帶有輕微回彈效果的曲線，讓動畫看起來更生動 (類似果凍感)
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    # bezier = smoothOut, 0.36, 0, 0.66, -0.56

    # 2. 視窗動畫 (Windows)
    # windowsIn: 打開視窗。popin 10% 代表從視窗大小的 10% 開始放大到 100% (中心向四周擴散)
    animation = windowsIn, 1, 6, overshot, popin 10%
    
    # windowsOut: 關閉視窗。邏輯與打開相反，會縮小回 10% 並消失
    animation = windowsOut, 1, 6, overshot, popin 10%
    
    # windowsMove: 移動視窗時的動畫，這裡設為滑動比較自然
    animation = windowsMove, 1, 6, overshot, slide

    # 3. 通知與圖層動畫 (Layers / Notifications)
    # 通知通常被視為 Layer (如 mako, dunst, swaync)
    # 這裡設定為 slide (滑進/滑出)
    animation = layersIn, 1, 5, overshot, slide
    animation = layersOut, 1, 5, overshot, slide
    
    # 淡入淡出效果 (可選，讓視覺更柔和)
    animation = fade, 1, 10, default
}