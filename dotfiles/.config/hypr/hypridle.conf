listener {
    timeout = 300
    on-timeout = upower -i $(upower -e | grep 'BAT') | grep -q 'discharging' && brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = upower -i $(upower -e | grep 'BAT') | grep -q 'discharging' && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
